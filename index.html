<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Kurai's chibi avatar; the Vite default was still shipping. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="theme-color" content="#fbf8fd" />

    <title>Hellane Kurai — Digital Artist</title>
    <meta
      name="description"
      content="Portfolio of Hellane Kurai, digital artist — rendered illustrations, pixel art, chibis, plus commission information."
    />

    <!-- TODO(kurai): set these once the domain is live. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hellane Kurai — Digital Artist" />
    <meta
      property="og:description"
      content="Portfolio of Hellane Kurai, digital artist — rendered illustrations, pixel art, chibis, plus commission information."
    />
    <!--
      Lives in public/ rather than src/assets/ on purpose: Vite hashes asset
      filenames, and this path has to stay stable for crawlers. It is a copy of
      the VGen cover art, 1920x1080 — close to the 1.91:1 platforms prefer.
      Declaring the size lets them lay the card out before fetching it.
    -->
    <meta property="og:image" content="/og-image.webp" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1080" />
    <meta
      property="og:image:alt"
      content="Cover artwork by Hellane Kurai — a rendered anime-style illustration."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
